[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-data"
version = "0.2.2"
description = "Descarga, carga y análisis de microdatos del DANE (GEIH y EAM) para estudiantes de economía."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Luis Ramírez" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.urls]
Homepage = "https://github.com/IntegralIndefinida/DANE-data"
Documentation = "https://integralindefinida.github.io/DANE-data/"
Repository = "https://github.com/IntegralIndefinida/DANE-data"
Issues = "https://github.com/IntegralIndefinida/DANE-data/issues"
Changelog = "https://github.com/IntegralIndefinida/DANE-data/releases"

[project.optional-dependencies]
app = ["streamlit>=1.51", "plotly>=5.18", "openpyxl>=3.1"]
dev = ["pytest>=7"]
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.1",
    "matplotlib>=3.8",
]

[project.scripts]
dane-data = "dane_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dane_data = ["data/*.json", "app/*.py", "app/paginas/*.py", "app/.streamlit/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
