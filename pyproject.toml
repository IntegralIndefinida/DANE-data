[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-data"
version = "0.6.0"
description = "Descarga, carga y análisis de microdatos del DANE (GEIH, EAM, Estadísticas Vitales, EMICRON, ECV y pobreza monetaria) para estudiantes de economía."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Luis Ramírez" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "pyarrow>=12",
    "inflate64>=1.0",
]

[project.urls]
Homepage = "https://github.com/IntegralIndefinida/DANE-data"
Documentation = "https://integralindefinida.github.io/DANE-data/"
Repository = "https://github.com/IntegralIndefinida/DANE-data"
Issues = "https://github.com/IntegralIndefinida/DANE-data/issues"
Changelog = "https://github.com/IntegralIndefinida/DANE-data/releases"

[project.optional-dependencies]
app = ["streamlit>=1.52", "plotly>=5.18", "openpyxl>=3.1"]
dev = ["pytest>=7", "ruff>=0.15"]
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.1",
    "matplotlib>=3.8",
]

[project.scripts]
dane-data = "dane_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dane_data = ["data/*.json", "data/*.parquet", "app/*.py", "app/*.svg", "app/paginas/*.py", "app/.streamlit/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# PEP 8 permite hasta 99 caracteres si el proyecto lo acuerda; 79 partía las tablas de códigos
# del DANE.
line-length = 99
target-version = "py310"
# Los notebooks se publican con sus salidas guardadas, y los ejemplos de los .md alinean a mano
# sus comentarios: el formateador no los toca.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "N"]

[tool.ruff.format]
docstring-code-format = true
