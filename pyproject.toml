[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-data"
version = "0.1.0"
description = "Descarga, carga y análisis de microdatos del DANE (GEIH y EAM) para estudiantes de economía."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Luis Ramírez" }]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.18", "openpyxl>=3.1"]
dev = ["pytest>=7"]

[project.scripts]
dane-data = "dane_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dane_data = ["data/*.json", "app/*.py", "app/paginas/*.py", "app/.streamlit/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
