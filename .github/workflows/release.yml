# Al publicar una etiqueta de versión (p. ej. `git tag v0.1.0 && git push origin v0.1.0`):
#   1. verifica que la etiqueta coincida con la versión de pyproject.toml y __init__.py,
#   2. corre las pruebas,
#   3. arma dane-data-<versión>.zip con la app y los lanzadores (sin tests/ ni .github/),
#   4. crea el Release en GitHub con ese zip adjunto,
#   5. publica el paquete en PyPI (Trusted Publishing, entorno `pypi`; sin token guardado).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verificar versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          INIT=$(grep -m1 '^__version__ = ' src/dane_data/__init__.py | cut -d'"' -f2)
          echo "etiqueta=${VERSION} pyproject=${PYPROJECT} __init__=${INIT}"
          test "${VERSION}" = "${PYPROJECT}" && test "${VERSION}" = "${INIT}"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      - name: Pruebas
        run: uv run --extra dev --extra app pytest -q

      - name: Armar zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOMBRE="dane-data-${VERSION}"
          git archive --format=zip --prefix="${NOMBRE}/" -o "${NOMBRE}.zip" "${GITHUB_REF_NAME}"
          unzip -l "${NOMBRE}.zip"
          echo "ZIP=${NOMBRE}.zip" >> "$GITHUB_ENV"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "dane-data ${GITHUB_REF_NAME}" \
            --notes-file .github/NOTAS_RELEASE.md

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      - name: Construir
        run: uv build

      - name: Publicar en PyPI
        run: uv publish
