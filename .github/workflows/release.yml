# Al publicar una etiqueta de versión (p. ej. `git tag v0.1.0 && git push origin v0.1.0`):
#   1. corre las pruebas,
#   2. arma dane-data-<versión>.zip con la app y los lanzadores (sin tests/ ni .github/),
#   3. crea el Release en GitHub con ese zip adjunto.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Pruebas
        run: uv run --extra dev --extra app pytest -q

      - name: Armar zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOMBRE="dane-data-${VERSION}"
          git archive --format=zip --prefix="${NOMBRE}/" -o "${NOMBRE}.zip" "${GITHUB_REF_NAME}"
          unzip -l "${NOMBRE}.zip"
          echo "ZIP=${NOMBRE}.zip" >> "$GITHUB_ENV"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "dane-data ${GITHUB_REF_NAME}" \
            --notes-file .github/NOTAS_RELEASE.md
