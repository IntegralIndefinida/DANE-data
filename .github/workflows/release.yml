# Al publicar una etiqueta de versión (p. ej. `git tag v0.1.0 && git push origin v0.1.0`):
#   1. verifica que la etiqueta coincida con la versión de pyproject.toml, __init__.py y CITATION.cff,
#   2. corre las pruebas,
#   3. compila el lanzador de Windows (lanzador/compilar.sh) y lo firma con SignPath si está configurado,
#   4. arma dane-data-<versión>.zip con la app y los lanzadores (sin tests/ ni .github/),
#   5. crea el Release en GitHub con ese zip adjunto,
#   6. publica el paquete en PyPI (Trusted Publishing, entorno `pypi`; sin token guardado).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read  # SignPath descarga de esta ejecución el lanzador sin firmar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verificar versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          INIT=$(grep -m1 '^__version__ = ' src/dane_data/__init__.py | cut -d'"' -f2)
          CFF=$(grep -m1 '^version: ' CITATION.cff | cut -d' ' -f2)
          echo "etiqueta=${VERSION} pyproject=${PYPROJECT} __init__=${INIT} CITATION.cff=${CFF}"
          test "${VERSION}" = "${PYPROJECT}" && test "${VERSION}" = "${INIT}" && test "${VERSION}" = "${CFF}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Pruebas
        run: uv run --locked --extra dev --extra app pytest -q

      - name: Compilar el lanzador de Windows
        run: lanzador/compilar.sh "build/Abrir dane-data.exe"

      # Firma con SignPath (certificado gratuito de SignPath Foundation para código abierto). Se activa al
      # definir en el repositorio la variable SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN; sin
      # ellos el .exe va sin firmar. Cada firma se aprueba a mano en signpath.io mientras este paso espera.
      # La configuración del artefacto en SignPath es lanzador/signpath.xml.
      - name: Subir el lanzador sin firmar
        id: sin-firmar
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lanzador-sin-firmar
          path: build/Abrir dane-data.exe
          if-no-files-found: error

      - name: Firmar el lanzador
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dane-data' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/firmado
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Usar el lanzador firmado
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: mv "build/firmado/Abrir dane-data.exe" "build/Abrir dane-data.exe"

      - name: Armar zip
        run: |
          NOMBRE="dane-data-${VERSION}"
          git archive --format=zip --prefix="${NOMBRE}/" --add-file="build/Abrir dane-data.exe" \
            -o "${NOMBRE}.zip" "${GITHUB_REF_NAME}"
          unzip -l "${NOMBRE}.zip"
          echo "ZIP=${NOMBRE}.zip" >> "$GITHUB_ENV"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "dane-data ${GITHUB_REF_NAME}" \
            --notes-file .github/NOTAS_RELEASE.md

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Construir
        run: uv build

      - name: Publicar en PyPI
        run: uv publish
